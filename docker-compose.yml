version: '3.8'

services:
  issue-automator:
    image: ninesun6666/issue-automator:latest
    # Uncomment below to build from source instead
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: issue-automator
    restart: unless-stopped
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    environment:
      # GitHub Configuration
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      # Server Configuration
      - WEBHOOK_PORT=${WEBHOOK_PORT:-8080}
      - WEBHOOK_HOST=0.0.0.0
      # AI Configuration (iFlow CLI)
      - apiKey=${apiKey}
      - baseUrl=${baseUrl:-}
      - modelName=${modelName:-}
      # Python
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist cloned repositories
      - ./repos:/app/repos
      # Persist logs
      - ./logs:/app/logs
      # Optional: Custom configuration
      # - ./issue-automator.config.json:/app/issue-automator.config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEBHOOK_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - issue-automator-network

  # Optional: Nginx reverse proxy for SSL (production)
  nginx:
    image: nginx:alpine
    container_name: issue-automator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - issue-automator
    networks:
      - issue-automator-network
    profiles:
      - production

networks:
  issue-automator-network:
    driver: bridge